name: Render and deploy the Quarto book

on:
  push:
    branches: [docs]
  pull_request:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book source
        uses: actions/checkout@v5

      - name: Check out the icare package source
        uses: actions/checkout@v5
        with:
          repository: YuLab-SMU/icare
          ref: main
          path: .ci/icare

      - name: Check out the archived DMwR source
        uses: actions/checkout@v5
        with:
          repository: cran/DMwR
          path: .ci/DMwR

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install icare and its workflow dependencies
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
         install.packages(c(
           "remotes",
           "BiocManager",

           # Classification / caret backends
           "caret",
           "caretEnsemble",
           "randomForest",
           "glmnet",
           "gbm",
           "rpart",
           "klaR",
           "C50",

           # General data analysis and plotting
           "ggplot2",
           "dplyr",
           "tidyr",
           "readxl",
           "patchwork",
           "ggrepel",
           "ggridges",
           "plotly",
           "pROC",
           "circlize",
           "shiny",

           # Clustering / unsupervised analysis
           "NMF",
           "mclust",

           # Survival analysis
           "survival",
           "survminer",
           "rms",
           "risksetROC",
           "maxstat",
           "survex",
           "dcurves",

           # mlr3 ecosystem
           "mlr3",
           "mlr3proba",
           "mlr3viz",
           "mlr3learners",
           "ranger",

           # Advanced mlr3 / tuning
           "mlr3mbo",
           "bbotk"
         ))
          remotes::install_github(
            "mlr-org/mlr3extralearners",
            upgrade = "never"
          )
          BiocManager::install("ComplexHeatmap", ask = FALSE, update = FALSE)
          remotes::install_local(
            ".ci/DMwR",
            dependencies = TRUE,
            upgrade = "never"
          )
          remotes::install_local(
            ".ci/icare",
            dependencies = TRUE,
            upgrade = "never"
          )

      - name: Render the book
        run: quarto render

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
